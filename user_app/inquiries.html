<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 1:1 문의 — P!CKLE</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<style>
    :root {
        --bg-base: #0a0a0c; --bg-card: #1c1c1e; --point-green: #4ADE80; --point-pink: #ff4d8d;
        --text-main: #fcfcfc; --text-sub: #a1a1aa; --border-soft: rgba(255,255,255,0.12); --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-base); color: var(--text-main); font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 70px; }
    .top { position: sticky; top: 0; z-index: 5; background: var(--bg-base); display: flex; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--border-soft); }
    .back { background: none; border: none; color: var(--text-main); font-size: 1.3rem; cursor: pointer; padding: 4px 8px; font-family: inherit; }
    .title { font-size: 1.05rem; font-weight: 900; margin: 0; }
    .guide { margin: 16px 0; padding: 14px 16px; background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: 14px; font-size: .84rem; line-height: 1.7; color: var(--text-sub); }
    .guide b { color: var(--text-main); }
    .empty, .loading, .err { text-align: center; color: var(--text-sub); padding: 48px 12px; font-weight: 700; }
    .err { color: #ff6b6b; }
    .card { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .card.focus { border-color: var(--point-green); box-shadow: 0 0 0 1px var(--point-green); }
    .q-title { font-weight: 800; font-size: .98rem; line-height: 1.4; word-break: break-all; }
    .q-meta { font-size: .76rem; color: var(--text-sub); margin-top: 4px; }
    .chip { display: inline-block; font-size: .72rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; margin-top: 10px; }
    .chip.pending { background: rgba(251,191,36,.12); color: var(--warn); }
    .chip.done { background: rgba(74,222,128,.12); color: var(--point-green); }
    .box-title { font-size: .74rem; font-weight: 800; color: var(--text-sub); margin: 12px 0 0; }
    .box { margin-top: 6px; padding: 10px 12px; background: #131315; border: 1px solid var(--border-soft); border-radius: 10px; font-size: .84rem; line-height: 1.65; white-space: pre-wrap; word-break: break-all; color: #d4d4d8; }
    .box.reply { border-color: rgba(74,222,128,.35); background: rgba(74,222,128,.05); color: var(--text-main); }
</style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <button type="button" class="back" id="backBtn" aria-label="뒤로">←</button>
        <h1 class="title">내 1:1 문의</h1>
    </div>
    <div class="guide">
        <b>보내주신 문의와 운영팀 답변을 확인할 수 있어요.</b><br>
        답변이 등록되면 <b>알림</b>으로도 알려드려요. 새 문의는 설정 &gt; 고객센터에서 남겨주세요.
    </div>
    <div id="list"><div class="loading">불러오는 중…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/supabase-bootstrap.js"></script>
<script>
(function () {
    'use strict';
    var TYPE = { general: '일반', account: '계정', point: '포인트', ad: '광고', report: '신고', other: '기타' };
    var focusId = '';
    try { focusId = new URLSearchParams(location.search).get('id') || ''; } catch (e) { /* ignore */ }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function client() {
        if (window.PickleSupabaseBootstrap && window.PickleSupabaseBootstrap.getClient) return window.PickleSupabaseBootstrap.getClient();
        if (window.PickleSupabase && window.PickleSupabase.getClient) return window.PickleSupabase.getClient();
        if (window.getPickleSupabaseClient) return window.getPickleSupabaseClient();
        return null;
    }
    function fmt(d) {
        var t = new Date(d);
        if (!d || isNaN(t.getTime())) return '-';
        return t.getFullYear() + '.' + (t.getMonth() + 1) + '.' + t.getDate() + ' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
    }
    function cardHtml(r) {
        var answered = r.status === 'completed' && r.admin_reply && String(r.admin_reply).trim();
        var h = '<div class="card' + (focusId === r.id ? ' focus' : '') + '" id="c-' + esc(r.id) + '">' +
            '<div class="q-title">' + esc(r.title || '(제목 없음)') + '</div>' +
            '<div class="q-meta">' + esc(TYPE[r.inquiry_type] || '일반') + ' · ' + fmt(r.created_at) + ' 접수</div>' +
            (answered ? '<span class="chip done">✅ 답변 완료</span>' : '<span class="chip pending">⏳ ' + (r.status === 'in_progress' ? '확인 중' : '답변 대기 중') + '</span>') +
            '<div class="box-title">내가 보낸 문의</div><div class="box">' + esc(r.content) + '</div>';
        if (answered) {
            h += '<div class="box-title">운영팀 답변' + (r.replied_at ? ' · ' + fmt(r.replied_at) : '') + '</div><div class="box reply">' + esc(r.admin_reply) + '</div>';
        }
        return h + '</div>';
    }
    async function load() {
        var list = document.getElementById('list');
        var sb = client();
        if (!sb) { list.innerHTML = '<div class="err">연결을 확인하지 못했어요. 새로고침해 주세요.</div>'; return; }
        var sess = await sb.auth.getSession();
        var user = sess && sess.data && sess.data.session ? sess.data.session.user : null;
        if (!user) {
            location.replace('login.html?redirect=' + encodeURIComponent('inquiries.html' + (focusId ? '?id=' + focusId : '')));
            return;
        }
        var res = await sb.from('inquiries')
            .select('id, inquiry_type, title, content, status, admin_reply, created_at, replied_at')
            .eq('user_id', user.id)
            .order('created_at', { ascending: false })
            .limit(50);
        if (res.error) { list.innerHTML = '<div class="err">불러오지 못했어요. 잠시 후 다시 시도해 주세요.</div>'; return; }
        var rows = res.data || [];
        if (!rows.length) { list.innerHTML = '<div class="empty">아직 보낸 문의가 없어요.</div>'; return; }
        list.innerHTML = rows.map(cardHtml).join('');
        var f = document.getElementById('c-' + focusId);
        if (f && f.scrollIntoView) f.scrollIntoView({ block: 'center' });
    }
    document.getElementById('backBtn').addEventListener('click', function () {
        if (history.length > 1) history.back(); else location.href = 'settings.html';
    });
    load();
})();
</script>
</body>
</html>
